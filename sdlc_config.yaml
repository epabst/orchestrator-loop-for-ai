states:
  - name: ai-requirements
    label: ai-requirements
    prompt: |
      Create a brief requirements summary (500-1500 characters maximum).
      Focus on:
      • Functional requirements: what must the software do?
      • Constraints: performance, compatibility, scope
      Do NOT: architectural details, design decisions
      Format: Start with "## Requirements Summary" then 5-8 bullet points only.
      Include the keyword "COMPLETED_REQUIREMENTS" when done.
    next_state: ai-design
    keywords:
      COMPLETED_REQUIREMENTS: ai-design
    doc_file: requirements.md

  - name: ai-design
    label: ai-design
    prompt: |
      Create a brief design summary (1000-2000 characters maximum).
      Focus on:
      • Architecture: how components interact
      • Implementation approach: key strategy and pattern
      • Technical decisions: critical choices and trade-offs
      Do NOT: list requirements, include long specifications
      Format: Start with "## Design Summary" then use bullet points for all details
      Include the keyword "COMPLETED_DESIGN" when done.
    next_state: ai-development
    keywords:
      COMPLETED_DESIGN: ai-development
    doc_file: design.md

  - name: ai-development
    label: ai-development
    prompt: |
      First, open issue_context.txt and find the comment marked
      "MOST RECENT COMMENT" - state in one sentence what it's asking for, then
      confirm your work this cycle actually implements it (not an earlier
      comment). If it's already implemented, say why.
      Implement the design:
      • Write failing tests first
      • Implement code to pass tests
      • Verify with the project's fastest full-signal test command. For Kotlin
        Compose Multiplatform repos that is `./gradlew desktopTest` and nothing
        else — do not run `test`, `check`, `build`, `allTests`, or any
        Android/iOS/web test task unless the change itself is specific to that
        platform, in which case also run that platform's test task and say so.
      Output a brief summary (300-800 characters) with bullet points:
      • What you built
      • Key implementation notes
      Do NOT: test results, long code dumps
      Include the keyword "COMPLETED_DEVELOPMENT" when done.
    next_state: ai-review
    keywords:
      COMPLETED_DEVELOPMENT: ai-review

  - name: ai-review
    label: ai-review
    prompt: |
      Review the code against requirements and design (500-1500 characters maximum).
      Confirm the diff addresses the "MOST RECENT COMMENT" in issue_context.txt
      specifically (not just an earlier comment) - if it doesn't, REVIEW_FAILED.
      Re-run only the project's fastest full-signal test command (for Kotlin
      Compose Multiplatform repos: `./gradlew desktopTest`); add another
      platform's test task only if the change is specific to that platform.
      Format as bullet points:
      • Pass/fail verdict
      • 1-2 critical issues (if any)
      • Overall quality note
      Do NOT: line-by-line analysis, minor issues
      Include: "REVIEW_PASSED" if ready, "REVIEW_FAILED" if needs work, "NEED_HUMAN_HELP" for questions
    next_state: ai-pr-creation
    keywords:
      REVIEW_PASSED: ai-pr-creation
      REVIEW_FAILED: ai-development

  - name: ai-pr-creation
    label: ai-pr-creation
    prompt: |
      Prepare a PR that represents ALL changes as a single atomic unit (300-800 char body).

      Steps:
      1. Look at the listed files above to find the repository directory name
      2. cd into that repository directory
      3. Run: git log origin/main.. --oneline (to list all commits on this branch)
      4. Run: git diff origin/main (to view ALL changes as a unified whole)
      5. Analyze all commits together and synthesize a PR title covering the PRIMARY goal
      6. Create a summary explaining what changed and why (single unified narrative)

      Output format (CRITICAL: each line must match exactly):
      PR_REQUESTED
      Title: <Brief title summarizing the complete set of changes>
      Body:
      • What was implemented/fixed (single unified summary across all commits)
      • Key changes across all commits (briefly)
      • Why these changes were needed
      END_PR_REQUEST

      CRITICAL: Never copy a single commit message as the PR title. ALWAYS analyze the full diff and all commits together to create a PR title and description that reflects the entire work as one atomic unit. Include "CHANGES_SUMMARIZED" when done.
    next_state: ai-awaiting-pr-merge
    keywords:
      CHANGES_SUMMARIZED: ai-awaiting-pr-merge

  # Handled by the orchestrator itself, not an agent: it keeps the PR rebased
  # and its build published, and once the PR is merged it checks the workspace
  # out on main, publishes a *-main build and moves the issue to ai-done. The
  # issue stays here - and keeps being polled even after a human closes it - so
  # a merge never goes unpublished.
  - name: ai-awaiting-pr-merge
    label: ai-awaiting-pr-merge
    native_handler: await-pr-merge
    next_state: ai-done

  - name: ai-done
    label: ai-done
    prompt: |
      The task is completed.
    keywords:
      DONE: ai-done

failure_label: ai-human-help
human_help_label: ai-human-help
lock_label: ai-processing
enabled_label: ai-enabled
pr_defined_keyword: CHANGES_SUMMARIZED
merge_conflict_keyword: MERGE_RESOLVED

# Keeps open PRs current with origin/main. Whenever origin/main moves, each
# ai-enabled issue's PR branch is rebased inside its ~/ai-workspaces checkout;
# when the rebase lands cleanly the branch is force-pushed and publish_script
# runs to build and publish a fresh dev build. Conflicts abort the rebase and
# leave a comment on the issue instead.
auto_rebase:
  enabled: true
  main_branch: main
  publish_script: publish-android-dev.sh
  check_interval_secs: 300
